{% extends "base.html" %}{% block titulo %}Atribuir Turmas{% endblock %}{% block conteudo %}
<style>.wrap{max-width:1100px;margin:auto}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px;box-shadow:0 2px 8px rgba(15,23,42,.05)}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}}label{display:block;font-size:.75rem;font-weight:800;color:#64748b;text-transform:uppercase;margin-bottom:6px}select,input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px}.lista{margin-top:12px;border:1px solid #e2e8f0;border-radius:12px;max-height:500px;overflow:auto}.aluno{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid #f1f5f9}.aluno:last-child{border-bottom:0}.aluno input{width:auto}.nome{flex:1}.turma-atual{color:#94a3b8;font-size:.8rem}.btn{margin-top:15px;background:#2563eb;color:white;border:0;border-radius:11px;padding:11px 17px;font-weight:700;cursor:pointer}.erro{background:#fee2e2;color:#991b1b;padding:12px;border-radius:10px;margin-bottom:15px}</style>
<div class="wrap"><h2>Atribuir Turmas</h2><p style="color:#64748b">Selecione uma turma e atribua vários alunos de uma só vez.</p><div class="card">{% if erro %}<div class="erro">{{ erro }}</div>{% endif %}<form method="POST"><div class="grid"><div><label>Turma</label><select name="turma_id" required><option value="">Selecione...</option>{% for t in turmas %}<option value="{{ t.id }}">{{ t.nome }} — {{ t.escola }}{% if t.ano_escolar %} · {{ t.ano_escolar }}{% endif %}</option>{% endfor %}</select></div><div><label>Pesquisar alunos</label><input id="pesquisa" placeholder="Nome do aluno..."></div></div><div class="lista" id="lista">{% for a in alunos %}<label class="aluno" data-nome="{{ a.nome|lower }}"><input type="checkbox" name="aluno_ids" value="{{ a.id }}"><span class="nome">{{ a.nome }}</span><span class="turma-atual">{{ a.turma or 'sem turma' }}</span></label>{% endfor %}</div><div style="color:#64748b;font-size:.82rem;margin-top:8px" id="contagem">0 alunos selecionados</div><button class="btn">Atribuir Turma</button></form></div></div><script>const p=document.getElementById('pesquisa');p.addEventListener('input',()=>{const q=p.value.toLowerCase().trim();document.querySelectorAll('.aluno').forEach(x=>x.style.display=x.dataset.nome.includes(q)?'flex':'none')});document.querySelectorAll('input[name="aluno_ids"]').forEach(x=>x.addEventListener('change',()=>document.getElementById('contagem').textContent=document.querySelectorAll('input[name="aluno_ids"]:checked').length+' alunos selecionados'));</script>
{% endblock %}
